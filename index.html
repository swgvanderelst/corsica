<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Corsica">
<meta name="theme-color" content="#0a7488">
<meta name="format-detection" content="telephone=no">
<title>Corsica</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
  <div class="app" id="app">
    <div id="root" class="root"></div>
    <div id="pushed"></div>
    <nav class="tabbar" id="tabs" role="tablist" aria-label="Hoofdmenu" hidden></nav>
    <div class="backdrop" id="bd"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="grab"></div><button class="close" data-a="sheet-close" aria-label="Sluiten">&times;</button><div class="body" id="sheetBody"></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="fatal" id="fatal" hidden></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
